name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download and Install Doxygen 1.18.0
        run: |
          # 1. Download the official prebuilt Linux binary tarball
          curl -sSLo doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          
          # 2. Extract and place the binary into a system path folder
          mkdir doxygen-temp
          tar xf doxygen.tar.gz --strip-components=1 -C doxygen-temp
          sudo mv doxygen-temp/bin/* /usr/local/bin/
          
          # 4. Clean up temporary files
          rm -rf doxygen.tar.gz doxygen-temp
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Run Doxygen
        run: doxygen Doxyfile # Adjust path if your Doxyfile is in a subfolder

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Target the exact subfolder where Doxygen outputs the HTML files
          path: './docs/html' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
